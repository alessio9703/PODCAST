# Esempio: nginx SULLA VPS, davanti al controller (che ascolta su 127.0.0.1:8765).
# Termina l'HTTPS fra CMS e VPS e accetta SOLO il CMS (IP ammessi e/o certificato client).
# Il controller verifica comunque la firma di ogni richiesta (DEPLOY.md §1).

server {
    listen 443 ssl;
    http2 on;
    server_name podcast-vps.life.example;           # nome interno della VPS

    ssl_certificate     /etc/ssl/podcast-vps/fullchain.pem;
    ssl_certificate_key /etc/ssl/podcast-vps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Solo il CMS: IP del CMS (oltre al firewall) e, se possibile, mTLS.
    allow 203.0.113.10;                              # IP del CMS (esempio)
    deny all;
    # ssl_client_certificate /etc/ssl/podcast-vps/cms-ca.pem;
    # ssl_verify_client on;

    # Niente log degli header di identita' (X-LIL-Firma): il formato di default non li registra.
    access_log /var/log/nginx/podcast-web.access.log;

    client_max_body_size 60m;                        # brani fino a 50 MB, documenti e voci 20 MB

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;                     # documento estratto subito: fino a 240 s
        proxy_send_timeout 300s;
    }

    # Caricamenti: corpo grezzo inoltrato in streaming (il controller conta i byte mentre arrivano).
    location ~ ^/api/(documenti|voci|musiche/(intro|outro|sottofondo))$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # SSE: niente buffering, connessioni lunghe (il controller manda un battito ogni 15 s).
    location ~ ^/api/episodi/[^/]+/eventi$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Audio: il controller gestisce Range da se'.
    location ~ ^/api/episodi/[^/]+/file/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
